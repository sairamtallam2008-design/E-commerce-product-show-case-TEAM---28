<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food App - Login</title>
<style>
body {margin:0;font-family:Arial;background:#f5f5f5;}
#login {background: url('https://images.unsplash.com/photo-1504754524776-8f4f37790ca0?w=1200&q=80') center/cover no-repeat; min-height: 100vh; display:flex; align-items:center; justify-content:center;}
#login .login-card {background: rgba(255,255,255,0.95); border-radius:16px; padding:30px 20px; width:90%; max-width:380px; box-shadow:0 18px 40px rgba(0,0,0,0.25);}
#login input {width:100%; margin-bottom:12px; padding:12px; border:1px solid #ddd; border-radius:8px; box-sizing: border-box;}
#login button {width:100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer;}
#login h2 {margin-bottom:20px;}
</style>
</head>
<body>

<div id="login">
    <div class="login-card" style="text-align: center;">
        <h2 id="authTitle">Login</h2>
        <input id="username" placeholder="Enter username"><br>
        <input id="password" type="password" placeholder="Enter password"><br>
        <input id="confirmPassword" type="password" style="display:none;" placeholder="Confirm password"><br>
        <button id="authButton" onclick="login()" style="background:#ff5722; color:white;">Login</button>
        <button id="toggleAuth" onclick="showSignup()" style="background:transparent; color:#ff5722; border:1px solid #ff5722; margin-top:10px;">Sign Up</button>
    </div>
</div>

<script>
let accounts = JSON.parse(localStorage.getItem("accounts")) || {};

window.onload = function() {
    if(localStorage.getItem("user")) {
        window.location.href = "home.html";
    }
}

function login(){
    let name = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value;
    if(!name || !pass) return alert("Please enter both username and password.");
    if(!accounts[name]) return alert("Account not found. Please sign up first.");
    if(accounts[name] !== pass) return alert("Incorrect password.");
    localStorage.setItem("user", name);
    window.location.href = "home.html";
}

function signUp(){
    let name = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value;
    let confirmPass = document.getElementById("confirmPassword").value;
    if(!name || !pass || !confirmPass) return alert("Please fill all fields.");
    if(pass !== confirmPass) return alert("Passwords do not match.");
    if(accounts[name]) return alert("Username already exists. Please login or choose another name.");
    accounts[name] = pass;
    localStorage.setItem("accounts", JSON.stringify(accounts));
    localStorage.setItem("user", name);
    window.location.href = "home.html";
}

function showSignup(){
    document.getElementById("authTitle").innerText = "Sign Up";
    document.getElementById("confirmPassword").style.display = "block";
    document.getElementById("authButton").innerText = "Create Account";
    document.getElementById("authButton").onclick = signUp;
    document.getElementById("toggleAuth").innerText = "Have an account? Login";
    document.getElementById("toggleAuth").onclick = showLogin;
}

function showLogin(){
    document.getElementById("authTitle").innerText = "Login";
    document.getElementById("confirmPassword").style.display = "none";
    document.getElementById("authButton").innerText = "Login";
    document.getElementById("authButton").onclick = login;
    document.getElementById("toggleAuth").innerText = "Sign Up";
    document.getElementById("toggleAuth").onclick = showSignup;
}
</script>

</body>
</html>
